name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # PRs: one group per PR so concurrent PR builds do not cancel each other.
  # main: shared "pages" group without cancel-in-progress so deploys are never cut off mid-flight.
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shared kit sync
        env:
          SN_HUB_PATH: ${{ runner.temp }}/sarawak-news-hub
        run: |
          PIN=$(tr -d '[:space:]' < kit/PIN)
          git init "$SN_HUB_PATH"
          git -C "$SN_HUB_PATH" remote add origin https://github.com/nazirulhafiy/sarawak-news-hub.git
          git -C "$SN_HUB_PATH" fetch --depth 1 origin "$PIN"
          python3 kit/sync.py --check --hub-path "$SN_HUB_PATH"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate schema
        run: python scripts/validate.py
      - name: Build static site
        run: python scripts/build.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
